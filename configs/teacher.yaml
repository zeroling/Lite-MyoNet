schema_version: 1
skeleton_config: skeletons/fullbody23.yaml
label_map: label_map.json
data:
  train: ../data/fullbody23/processed/train.npz
  val: ../data/fullbody23/processed/val.npz
  test: ../data/fullbody23/processed/test.npz
output_root: ../runs/fullbody23
seeds: [2026]
epochs: 300
batch_size: 32
num_workers: 0
cpu_threads: 1
precision: bf16
deterministic: true
selection_metric: macro_f1
model:
  dropout: 0.05
  spatial_attention_config:
    num_heads: 8
    cdiv_win: 5
  symmetry_attention_config:
    num_heads: 8
    use_contra: true
  scale_attention_config:
    num_heads: 8
  head_config:
    dropout: 0.30
    norm: layernorm
    scale_init: 10.0
    scale_min: 1.0
    scale_max: 20.0
    num_mc_samples: 0
    mc_dropout_eval: false
loss:
  label_smoothing: 0.05
optimizer:
  type: AdamW
  peak_lr: 0.0005
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8
scheduler:
  warmup_ratio: 0.1
  warmup_init_lr: 0.0001
  warmup_gamma: 1.0
  decay_gamma: 2.0
