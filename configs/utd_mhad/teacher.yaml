schema_version: 1
skeleton_config: ../skeletons/utd_mhad20.yaml
label_map: ../label_maps/utd_mhad27.json
data:
  train: ../../data/utd_mhad/processed/train.npz
  val: ../../data/utd_mhad/processed/val.npz
  test: ../../data/utd_mhad/processed/test.npz
output_root: ../../runs/utd_mhad
seeds: [2026]
epochs: 300
batch_size: 32
num_workers: 0
cpu_threads: 1
precision: bf16
deterministic: true
selection_metric: macro_f1
model:
  dropout: 0.05
  spatial_attention_config:
    num_heads: 8
    cdiv_win: 5
  symmetry_attention_config:
    num_heads: 8
    use_contra: true
  scale_attention_config:
    num_heads: 8
  head_config:
    dropout: 0.30
    norm: layernorm
    scale_init: 10
    scale_min: 1
    scale_max: 20
    num_mc_samples: 0
    mc_dropout_eval: false
loss:
  label_smoothing: 0.05
optimizer:
  peak_lr: 0.0005
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8
scheduler:
  warmup_ratio: 0.1
  warmup_init_lr: 0.0001
  warmup_gamma: 1
  decay_gamma: 2
