    warmup_prefix: false
    label_smoothing: 0.1
    grad_clip: 1.0
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    epochs: 300
    learning_rate_batch_scaling: false
  skefreqmix:
    optimizer: SGD
    lr: 0.1
    weight_decay: 0.0005
    warmup: 15
    milestones:
    - 105
    - 165
    - 225
    momentum: 0.9
    nesterov: true
    epochs: 300
    learning_rate_batch_scaling: false
  hypergcn:
